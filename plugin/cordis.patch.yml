# 把「电脑操作模式」与「思考浮窗」设置项挂到 DSH 设置界面，
# 并注册 evolution-computer-use 自带的 MCP 服务器（lib/cli.js serve）。
#
# DSH 在 profile 里把 name 当包 specifier 解析，所以都指向本包：
#   evolution-computer-use-win/plugin -> 本包 exports["./plugin"] = plugin/lib/index.js（设置页后端）
#   evolution-computer-use-win        -> 本包 exports["."]      = lib/index.js（导出 apply / bridgeConfig）
- insert:
    - id: evolution-desktop-mode
      name: 'evolution-computer-use-win/plugin'
      config:
        desktopMode: background
        overlayEnabled: true
        overlayPosition: top-right
        overlayWidth: 360
        overlayHeight: 240
        overlayOpacity: 60
        overlayLocked: true
    - id: evolution-computer-use
      name: 'evolution-computer-use-win'
      config:
        desktopMode: background
